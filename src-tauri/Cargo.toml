[package]
name = "umbra"
version = "0.1.1"
description = "Lightning fast system search tool"
edition = "2021"

# Fast iteration profile: same app, skips LTO/single-CG so rebuilds are quick.
# Use for dev builds: cargo build --profile fast
[profile.fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
incremental = true
strip = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
dirs = "6"
open = "5"
png = "0.17"
base64 = "0.22"
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_Foundation",
] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
] }
tauri-plugin-single-instance = "2.4.4"
jwalk = "0.9.0"
